name: build-windows  
  
on:  
  push:  
  pull_request:  
  workflow_dispatch:  
jobs:  
  build:  
    runs-on: windows-latest  
    strategy:  
      matrix:  
        arch: [x64, Win32]  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Configure  
        run: cmake -S . -B build -A ${{ matrix.arch }} -DLIBRARY_TYPE=SHARED -DBUILD_TESTS=ON -DUSE_SANITIZERS=OFF -DUTIL_CHARCNV_ICONV=OFF -DUTIL_CHARCNV_WINAPI=ON -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/libs/lib/zdll.lib -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/libs/lib/zdll.lib   
  
      - name: Build  
        run: cmake --build build --config Release --parallel  
  
      - name: Upload artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: libvgm-windows-${{ matrix.arch }}  
          path: build/bin/Release/
